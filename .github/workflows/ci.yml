name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-15 ships Xcode 16. macos-14's default toolchain is Swift 5.10,
    # which cannot open a swift-tools-version:6.0 package at all — it fails
    # before compiling a single file.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build -c debug

      - name: Test
        run: swift test
