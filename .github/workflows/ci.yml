name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Must match the toolchain that builds the shipped DMG (Xcode 26 / Swift 6.2).
    # Older images are not merely "stricter" — they carry an older SDK where
    # NSImage is not Sendable, so AppKit types cannot cross an actor boundary
    # and the app genuinely does not compile there.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build -c debug

      - name: Test
        run: swift test
